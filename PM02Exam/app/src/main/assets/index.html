<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экзамен ПМ 02 — тренажёр</title>
<style>
:root{
  --bg:#eef1f5;--panel:#ffffff;--ink:#1b2430;--muted:#5d6b7e;--line:#d5dce6;
  --accent:#2f5bff;--accent-ink:#ffffff;--ok:#1b8a57;--ok-bg:#e3f5ec;--bad:#c93a2a;--bad-bg:#fbe7e4;--sel:#e6ecff;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12161d;--panel:#1b212b;--ink:#e8edf4;--muted:#93a1b5;--line:#2c3542;--accent:#6c8cff;--accent-ink:#0d1220;--ok:#4cc38a;--ok-bg:#16322a;--bad:#ff7a69;--bad-bg:#3a1f1c;--sel:#232d4d}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.7rem;line-height:1.2;margin:8px 0 6px;letter-spacing:-.01em}
h2{font-size:1.25rem;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 16px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer;font:inherit}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
label.lbl{display:block;font-weight:600;margin-top:14px}
button.main{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer}
button.main:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px 18px;font:inherit;cursor:pointer}
button:focus-visible,.opt:focus-within,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.qtext{font-size:1.15rem;font-weight:600;margin:0 0 6px;white-space:pre-wrap}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 14px}
.qtext img,.opt img{max-width:100%;vertical-align:middle}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--panel)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;flex:none;width:18px;height:18px;accent-color:var(--accent)}
.opt.sel{background:var(--sel);border-color:var(--accent)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.locked .opt{cursor:default}
.fb{padding:12px 14px;border-radius:10px;margin:12px 0;font-weight:600}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb span{display:block;font-weight:400;color:var(--ink);margin-top:2px}
input.txt{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);margin:12px 0}
.steps{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.step{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.step[disabled]{opacity:.45;cursor:default}
.seq{min-height:44px;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;color:var(--muted)}
.seq b{color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.score{font-size:3rem;font-weight:800;line-height:1;margin:4px 0}
.verdict{font-size:1.1rem;margin:6px 0 16px}
.mist{border-top:1px solid var(--line);padding:14px 0}
.mist:first-child{border-top:0}
.mist .qq{font-weight:600;margin-bottom:6px}
.mist .you{color:var(--bad)}
.mist .right{color:var(--ok)}
.small{font-size:.88rem;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div id="start">
  <h1>Экзамен ПМ 02 — Документирование</h1>
  <p class="sub">Тренажёр на <span id="total"></span> вопросов из твоего файла. Правильные ответы взяты из пометок в нём же.</p>
  <div class="card" id="searchCard" style="margin-bottom:16px">
    <h2>Поиск по вопросам и ответам</h2>
    <input class="txt" id="searchInput" type="text" inputmode="search" placeholder="Введи слово или фразу…" autocomplete="off" style="margin:4px 0 8px">
    <p class="small" id="searchCount" aria-live="polite">Начни вводить запрос — покажу подходящие вопросы и правильные ответы.</p>
    <div id="searchResults"></div>
  </div>
  <div class="card">
    <label class="lbl">Сколько вопросов</label>
    <div class="row" id="cntRow"></div>
    <label class="lbl">Порядок</label>
    <div class="row" id="ordRow"></div>
    <label class="lbl">Проверка</label>
    <div class="row" id="fbRow"></div>
    <label class="lbl">Диапазон вопросов по номерам (необязательно)</label>
    <div class="row"><input class="txt" id="rng" style="max-width:260px;margin:0" placeholder="например 100-200"></div>
    <div class="actions"><button class="main" id="go">Начать</button></div>
  </div>
  <p class="small">Горячие клавиши: цифры выбирают вариант, Enter — ответить или дальше.</p>
</div>

<div id="quiz" hidden>
  <div class="top"><span id="pos"></span><span id="qno"></span></div>
  <div class="bar"><i id="barfill"></i></div>
  <div class="card" id="qcard">
    <p class="qtext" id="qtext"></p>
    <p class="hint" id="qhint"></p>
    <div id="qbody"></div>
    <div id="fb"></div>
    <div class="actions">
      <button class="main" id="check">Ответить</button>
      <button class="main" id="next" hidden>Дальше</button>
      <button class="ghost" id="quit">Сдаться</button>
    </div>
  </div>
</div>

<div id="result" hidden>
  <div class="card">
    <div class="score" id="rscore"></div>
    <p class="verdict" id="rverd"></p>
    <div class="actions">
      <button class="main" id="again">Заново</button>
      <button class="ghost" id="retryBad">Пересдать ошибки</button>
      <button class="ghost" id="toStart">В начало</button>
    </div>
  </div>
  <h2 style="margin-top:22px" id="mh"></h2>
  <div class="card" id="mlist"></div>
</div>
</main>

<script>

const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function rich(s){
  return esc(s).replace(/ZZIMG(\d+)ZZ/g,(m,n)=>IMGS[n]?'<img alt="" src="'+IMGS[n]+'">':'');
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const NOSHUF=/перечисленн|все ответы|верны все|все варианты|ни один|оба|все верно|всё верно|все вышеперечисл/i;
const norm = s => s.toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim();

$('total').textContent = QS.length;

// ---------- search across all questions and answer options ----------
function runSearch() {
  const input = $('searchInput');
  const query = norm(input.value);
  const results = $('searchResults');
  results.replaceChildren();
  if (!query) {
    $('searchCount').textContent = 'Начни вводить запрос — покажу подходящие вопросы и правильные ответы.';
    return;
  }

  // В исходном тесте есть не только вопросы с вариантами (o),
  // но и текстовые задания (acc/show), а также задание на порядок (steps).
  // Поэтому для каждого вопроса безопасно собираем все имеющиеся поля.
  const matches = QS.filter(q => {
    const options = Array.isArray(q.o) ? q.o.map(a => a && a.t || '') : [];
    const accepted = Array.isArray(q.acc) ? q.acc : (q.acc == null ? [] : [q.acc]);
    const steps = Array.isArray(q.steps) ? q.steps : [];
    const searchable = [q.q || '', q.show || '', ...accepted, ...steps, ...options].join(' ');
    return norm(searchable).includes(query);
  });

  $('searchCount').textContent = matches.length
    ? 'Найдено вопросов: ' + matches.length
    : 'По запросу «' + input.value.trim() + '» ничего не найдено. Попробуй другое слово.';

  matches.forEach(q => {
    const item = document.createElement('div');
    item.className = 'mist search-result';
    const question = document.createElement('div');
    question.className = 'qq';
    question.textContent = 'Вопрос №' + q.n + '. ' + q.q;
    const answerLabel = document.createElement('div');
    answerLabel.style.fontWeight = '600';
    answerLabel.style.marginTop = '8px';
    answerLabel.textContent = 'Правильный ответ:';
    const answer = document.createElement('div');
    answer.className = 'right';
    answer.style.whiteSpace = 'pre-wrap';

    let correct = [];
    if (Array.isArray(q.o)) {
      correct = q.o.filter(a => a && a.ok).map(a => a.t);
    }
    if (!correct.length && Array.isArray(q.steps)) {
      correct = q.steps.map((step, index) => (index + 1) + '. ' + step);
    }
    if (!correct.length && Array.isArray(q.acc)) {
      correct = q.acc.map(String);
    }
    if (!correct.length && q.show) {
      correct = [String(q.show)];
    }
    answer.textContent = correct.length
      ? correct.join('\n')
      : 'В исходном файле правильный ответ не отмечен.';
    item.append(question, answerLabel, answer);
    results.appendChild(item);
  });
}
// Несколько событий для надёжной работы поиска в мобильных браузерах и при открытии HTML локально.
$('searchInput').addEventListener('input', runSearch);
$('searchInput').addEventListener('keyup', runSearch);
$('searchInput').addEventListener('change', runSearch);
$('searchInput').addEventListener('search', runSearch);

const cfg = {count:20, order:'rand', fb:'now'};
function chips(rowId, items, key){
  const row=$(rowId);
  items.forEach(([val,label])=>{
    const b=document.createElement('button');b.className='chip';b.textContent=label;
    b.setAttribute('aria-pressed', String(cfg[key]===val));
    b.onclick=()=>{cfg[key]=val;[...row.children].forEach(c=>c.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')};
    row.appendChild(b);
  });
}
chips('cntRow',[[10,'10'],[20,'20'],[40,'40'],[100,'100'],[0,'Все '+QS.length]],'count');
chips('ordRow',[['rand','Вперемешку'],['seq','По порядку']],'order');
chips('fbRow',[['now','Сразу после ответа'],['end','В конце']],'fb');

let run=null;
function pool(){
  let p=QS;
  const m=$('rng').value.match(/(\d+)\s*[-–—]\s*(\d+)/);
  if(m){const a=+m[1],b=+m[2];p=p.filter(q=>q.n>=Math.min(a,b)&&q.n<=Math.max(a,b))}
  return p;
}
$('go').onclick=()=>{
  let p=pool();
  if(!p.length){alert('В этом диапазоне вопросов нет.');return}
  p = cfg.order==='rand' ? shuffle(p) : p.slice();
  if(cfg.count && cfg.count<p.length){
    p = cfg.order==='rand' ? p.slice(0,cfg.count) : p.slice(0,cfg.count);
  }
  startRun(p);
};

function startRun(list){
  run={list, i:0, results:[], fb:cfg.fb};
  $('start').hidden=true;$('result').hidden=true;$('quiz').hidden=false;
  show();
}

// ---------- question ----------
let cur=null, locked=false;
function show(){
  const q=run.list[run.i]; locked=false;
  cur={q, sel:new Set(), seq:[], order:null};
  $('pos').textContent='Вопрос '+(run.i+1)+' из '+run.list.length;
  $('qno').textContent='№'+q.n+' в файле';
  $('barfill').style.width=(run.i/run.list.length*100)+'%';
  $('qtext').innerHTML=rich(q.q);
  $('fb').innerHTML='';
  $('qcard').classList.remove('locked');
  $('check').hidden=false;$('check').disabled=true;$('next').hidden=true;
  const body=$('qbody');body.innerHTML='';
  if(q.t==='single'||q.t==='multi'){
    $('qhint').textContent=q.t==='multi'?'Выбери все правильные варианты.':'Один правильный вариант.';
    const idx=q.o.map((_,k)=>k);
    cur.order = q.o.some(o=>NOSHUF.test(o.t)) ? idx : shuffle(idx);
    const box=document.createElement('div');box.className='opts';
    cur.order.forEach((k,pos)=>{
      const o=q.o[k];
      const lab=document.createElement('label');lab.className='opt';lab.dataset.k=k;
      const inp=document.createElement('input');inp.type=q.t==='multi'?'checkbox':'radio';inp.name='a';
      inp.onchange=()=>{
        if(locked)return;
        if(q.t==='single'){cur.sel=new Set([k])}
        else{inp.checked?cur.sel.add(k):cur.sel.delete(k)}
        box.querySelectorAll('.opt').forEach(l=>l.classList.toggle('sel',cur.sel.has(+l.dataset.k)));
        $('check').disabled=cur.sel.size===0;
      };
      const sp=document.createElement('span');sp.innerHTML=rich(o.t);
      lab.append(inp,sp);box.appendChild(lab);
    });
    body.appendChild(box);
  } else if(q.t==='text'){
    $('qhint').textContent='Впиши ответ.';
    const inp=document.createElement('input');inp.className='txt';inp.id='txt';inp.autocomplete='off';
    inp.oninput=()=>{$('check').disabled=!inp.value.trim()};
    body.appendChild(inp);inp.focus();
  } else if(q.t==='order'){
    $('qhint').textContent='Нажимай шаги в правильном порядке.';
    cur.order=shuffle(q.steps.map((_,k)=>k));
    const seq=document.createElement('div');seq.className='seq';seq.id='seq';
    const st=document.createElement('div');st.className='steps';
    cur.order.forEach(k=>{
      const b=document.createElement('button');b.className='step';b.textContent=q.steps[k];b.dataset.k=k;
      b.onclick=()=>{ if(locked)return; cur.seq.push(k);b.disabled=true;drawSeq();$('check').disabled=cur.seq.length!==q.steps.length};
      st.appendChild(b);
    });
    const rst=document.createElement('button');rst.className='ghost';rst.textContent='Сбросить';
    rst.onclick=()=>{if(locked)return;cur.seq=[];st.querySelectorAll('.step').forEach(b=>b.disabled=false);drawSeq();$('check').disabled=true};
    body.append(seq,st,rst);drawSeq();
  }
}
function drawSeq(){
  const s=$('seq');if(!s)return;
  s.innerHTML=cur.seq.length?cur.seq.map((k,i)=>'<div><b>'+(i+1)+'.</b> '+esc(cur.q.steps[k])+'</div>').join(''):'Пока пусто';
}
function evaluate(){
  const q=cur.q;
  if(q.t==='single'||q.t==='multi'){
    const right=new Set(q.o.map((o,k)=>o.ok?k:-1).filter(k=>k>=0));
    return right.size===cur.sel.size && [...right].every(k=>cur.sel.has(k));
  }
  if(q.t==='text'){
    const v=norm($('txt').value);
    if(q.rx) return new RegExp(q.rx,'i').test(v);
    return q.acc.some(a=>norm(a)===v);
  }
  if(q.t==='order') return cur.seq.every((k,i)=>k===i);
}
function correctText(q){
  if(q.t==='text') return q.show;
  if(q.t==='order') return q.steps.map((s,i)=>(i+1)+'. '+s).join('\n');
  return q.o.filter(o=>o.ok).map(o=>o.t).join('; ');
}
function yourText(){
  const q=cur.q;
  if(q.t==='text') return $('txt').value.trim();
  if(q.t==='order') return cur.seq.map((k,i)=>(i+1)+'. '+q.steps[k]).join('\n');
  return [...cur.sel].map(k=>q.o[k].t).join('; ');
}
function doCheck(){
  if(locked||$('check').disabled)return;
  locked=true;
  const ok=evaluate(), q=cur.q;
  run.results.push({q,ok,you:yourText(),right:correctText(q)});
  $('check').hidden=true;
  if(run.fb==='now'){
    $('qcard').classList.add('locked');
    if(q.t==='single'||q.t==='multi'){
      $('qbody').querySelectorAll('.opt').forEach(l=>{
        const k=+l.dataset.k,o=q.o[k],chosen=cur.sel.has(k);
        l.querySelector('input').disabled=true;
        if(o.ok&&chosen)l.classList.add('ok');
        else if(o.ok&&!chosen)l.classList.add('missed');
        else if(!o.ok&&chosen)l.classList.add('bad');
      });
    }
    const f=document.createElement('div');f.className='fb '+(ok?'ok':'bad');
    f.textContent=ok?'Верно.':'Мимо.';
    if(!ok&&(q.t==='text'||q.t==='order')){const s=document.createElement('span');s.style.whiteSpace='pre-wrap';s.textContent='Правильно: '+correctText(q);f.appendChild(s)}
    $('fb').appendChild(f);
    $('next').hidden=false;$('next').textContent=run.i+1<run.list.length?'Дальше':'Результат';$('next').focus();
  } else {
    advance();
  }
}
function advance(){
  run.i++;
  if(run.i>=run.list.length) finish(); else show();
}
$('check').onclick=doCheck;
$('next').onclick=advance;
$('quit').onclick=()=>{ if(confirm('Закончить и посмотреть результат?')){ // unanswered count as wrong
  if(!locked){} run.list=run.list.slice(0,run.results.length); if(!run.list.length){backToStart();return} finish(); } };

document.addEventListener('keydown',e=>{
  if($('quiz').hidden)return;
  if(e.target.tagName==='INPUT'&&e.target.type==='text'&&e.key!=='Enter')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if(!$('next').hidden)advance(); else doCheck();
  } else if(/^[1-9]$/.test(e.key)&&!locked&&cur.q.o&&e.target.tagName!=='INPUT'){
    const pos=+e.key-1;const l=$('qbody').querySelectorAll('.opt')[pos];
    if(l){const i=l.querySelector('input');i.click()}
  }
});

// ---------- result ----------
function verdict(p){
  if(p===100)return 'Сто процентов. Либо ты зубрила, либо подсмотрел в файл. Мы не осуждаем. Почти.';
  if(p>=90)return 'Отлично. Даже обидно, что приходится это признавать.';
  if(p>=75)return 'Сойдёт. Препод вздохнёт, но руку к зачётке протянет.';
  if(p>=50)return 'Ровно настолько, чтобы не выгнали. Пока.';
  if(p>=25)return 'Это не экзамен, это акт милосердия, что ты вообще дошёл до конца. Читай и приходи снова.';
  return 'Рандомное тыкание дало бы больше. Серьёзно, вернись к файлу.';
}
function finish(){
  $('quiz').hidden=true;$('result').hidden=false;
  const tot=run.results.length, good=run.results.filter(r=>r.ok).length;
  const p=tot?Math.round(good/tot*100):0;
  $('rscore').textContent=good+' / '+tot+'  ('+p+'%)';
  $('rverd').textContent=verdict(p);
  const bad=run.results.filter(r=>!r.ok);
  $('mh').textContent=bad.length?('Где накосячил: '+bad.length):'Ошибок нет. Скучно.';
  $('retryBad').hidden=!bad.length;
  const L=$('mlist');L.innerHTML='';L.hidden=!bad.length;
  bad.forEach(r=>{
    const d=document.createElement('div');d.className='mist';
    const q=document.createElement('div');q.className='qq';q.innerHTML='№'+r.q.n+'. '+rich(r.q.q);
    const you=document.createElement('div');you.className='you';you.style.whiteSpace='pre-wrap';
    const right=document.createElement('div');right.className='right';right.style.whiteSpace='pre-wrap';
    you.innerHTML='Ты: '+(r.you?rich(r.you):'—');
    right.innerHTML='Надо: '+rich(r.right);
    d.append(q,you,right);L.appendChild(d);
  });
  window.scrollTo(0,0);
}
function backToStart(){ $('quiz').hidden=true;$('result').hidden=true;$('start').hidden=false }
$('again').onclick=()=>{ const p=run.fullList||run.list; startRun(cfg.order==='rand'?shuffle(p):p) };
$('retryBad').onclick=()=>{ const bad=run.results.filter(r=>!r.ok).map(r=>r.q); const full=run.list; startRun(shuffle(bad)); run.fullList=full };
$('toStart').onclick=backToStart;
</script>
