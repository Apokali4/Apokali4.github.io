# Automatic build and publication of Аптечная смена.
name: Build and deploy Аптечная смена

on:
  push:
    branches:
      - main
    paths:
      - 'aptechnaya-smena-1.0.0.zip'
      - '.github/workflows/pharmacy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pharmacy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract application
        run: |
          mkdir -p pharmacy-src
          unzip -q aptechnaya-smena-1.0.0.zip -d extracted
          cp -a extracted/aptechnaya-smena/. pharmacy-src/
      - name: Install dependencies
        working-directory: pharmacy-src
        run: npm install
      - name: Run tests
        working-directory: pharmacy-src
        run: npm test
      - name: Build web app
        working-directory: pharmacy-src
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pharmacy-src/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
