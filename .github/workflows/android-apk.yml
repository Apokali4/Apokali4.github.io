name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'aptechnaya-smena-1.0.0.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aptechnaya-smena-android
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build game assets
        run: |
          mkdir -p webapp
          unzip -q aptechnaya-smena-1.0.0.zip -d extracted
          cp -a extracted/aptechnaya-smena/. webapp/
          cd webapp
          npm install
          npm test
          npm run build

      - name: Package game into Android app
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -a webapp/dist/. android/app/src/main/assets/public/

      - name: Assemble APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: aptechnaya-smena-1.0.0-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
