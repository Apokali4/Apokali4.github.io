name: Build Native Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'aptechnaya-smena-1.0.0.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aptechnaya-smena-android
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Add source lesson banks to native app assets
        run: |
          mkdir -p android/app/src/main/assets
          unzip -q aptechnaya-smena-1.0.0.zip -d extracted
          cp extracted/aptechnaya-smena/src/data/lessons.json android/app/src/main/assets/lessons.json
          cp extracted/aptechnaya-smena/src/data/practice.json android/app/src/main/assets/practice.json
          cp extracted/aptechnaya-smena/src/data/syllabus.json android/app/src/main/assets/syllabus.json
      - name: Run native unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble native APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: aptechnaya-smena-1.0.3-native-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
