<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171321">
<title>Приглашение в IQ40</title>
<style>
:root{color-scheme:dark;--bg:#171321;--panel:#241a32;--line:#514064;--purple:#a020d0;--text:#f7f1fb;--muted:#c0b3ca;--error:#ff9caa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#382047 0,#171321 65%);color:var(--text);font:16px system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:22px}
main{width:min(100%,440px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,#2b2038f2,#1c1825f5);padding:28px;box-shadow:0 24px 70px #0008}
.mark{width:64px;height:64px;border-radius:50%;border:3px solid var(--purple);display:grid;place-items:center;color:#c45be8;font-size:30px;font-weight:800}
h1{font-size:25px;margin:22px 0 8px}
p{color:var(--muted);line-height:1.5}
#message.error{color:var(--error)}
button{display:flex;width:100%;min-height:58px;align-items:center;justify-content:center;border:0;border-radius:17px;background:var(--purple);color:white;font-weight:750;font-size:17px;margin-top:22px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
small{display:block;color:var(--muted);margin-top:18px;line-height:1.45}
</style>
</head>
<body>
<main>
<div class="mark">IQ</div>
<h1>Приглашение в IQ40</h1>
<p id="message">Проверяем приглашение…</p>
<button id="confirm" type="button" disabled>Подтвердить ссылку</button>
<small id="hint">После подтверждения IQ40 откроет приложение, обменяется открытыми ключами и добавит контакт в диалог.</small>
</main>
<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const payload = params.get("payload") || "";
  const message = document.getElementById("message");
  const button = document.getElementById("confirm");
  const hint = document.getElementById("hint");
  let valid = false;
  let displayName = "";

  try {
    const prefix = "deadnet-pair:v2:";
    if (!payload.startsWith(prefix)) throw new Error("Формат приглашения не поддерживается.");
    const encoded = payload.slice(prefix.length);
    if (!encoded || encoded.length > 8192) throw new Error("Приглашение повреждено или обрезано.");
    const normalized = encoded.replace(/-/g, "+").replace(/_/g, "/");
    const bytes = Uint8Array.from(atob(normalized + "=".repeat((4 - normalized.length % 4) % 4)), c => c.charCodeAt(0));
    const data = JSON.parse(new TextDecoder().decode(bytes));
    if (data.v !== 2 || typeof data.id !== "string" || !data.id ||
        typeof data.name !== "string" || !data.name ||
        typeof data.key !== "string" || !data.key ||
        typeof data.fp !== "string" || !data.fp ||
        typeof data.nonce !== "string" || !data.nonce ||
        typeof data.iat !== "number" || typeof data.exp !== "number") {
      throw new Error("В приглашении отсутствуют обязательные данные.");
    }
    if (data.exp <= Date.now() || data.exp - data.iat !== 180000) {
      throw new Error("Срок действия приглашения истёк. Попросите отправителя создать новую ссылку.");
    }
    displayName = data.name;
    valid = true;
    message.textContent = "Вас приглашает " + displayName + ". Нажмите единственную кнопку, чтобы подтвердить контакт в IQ40.";
    button.disabled = false;
  } catch (error) {
    message.classList.add("error");
    message.textContent = error && error.message ? error.message : "Ссылка приглашения повреждена или неполная. Попросите отправителя создать новую.";
    button.disabled = true;
    hint.textContent = "IQ40 не получил полные данные приглашения. Повторно создайте ссылку в приложении отправителя.";
  }

  button.addEventListener("click", () => {
    if (!valid) return;
    const deepLink = "iq40://pair?payload=" + encodeURIComponent(payload);
    window.location.href = deepLink;
    message.textContent = "Открываем IQ40 для подтверждения контакта…";
  });
})();
</script>
</body>
</html>
